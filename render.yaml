services:
  - type: web
    name: ksemo
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://ksemo.onrender.com/api/auth/google/callback
      - key: VITE_APP_ID
        value: ksemo-production
      - key: JWT_SECRET
        sync: false
