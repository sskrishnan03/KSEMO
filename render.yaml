services:
  - type: web
    name: ksemo
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Using external Supabase database instead of Render database
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_SERVER_URL
        value: https://ksemo.onrender.com
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      # Google OAuth Configuration
      - key: GOOGLE_CLIENT_ID
        value: 133538333062-nt80baf92t8mngs8t5me30iv0h8bdgdh.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://ksemo.onrender.com/api/auth/google/callback
      # SMTP Configuration
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # AI Configuration
      - key: LLM_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AIML_API_KEY
        sync: false
      - key: AIML_MODEL
        sync: false
    healthCheckPath: /
    autoDeploy: false
